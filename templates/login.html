{% extends "layout.html" %}

{% block content %}

<!-- =====================================================================
     templates/login.html
     Purpose: Login form for registered users.
     Academic References:
       - MDN Forms: https://developer.mozilla.org/en-US/docs/Learn/Forms
       - Flask POST handling: https://flask.palletsprojects.com/en/3.0.x/quickstart/#http-methods
       - HTML form semantics: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/form
   ===================================================================== -->

<h1 class="fade-in-up">Login</h1>

<!-- ------------------------------------------------------------
     LOGIN FORM CARD — Centered, animated
------------------------------------------------------------- -->
<div class="form-card fade-in-up" style="max-width: 480px; margin: 2rem auto;">
    <form method="post">

        <!-- Email -->
        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-primary" style="width: 100%;">
            Login
        </button>
    </form>
</div>

<!-- ------------------------------------------------------------
     NAVIGATION — Link to registration
------------------------------------------------------------- -->
<div class="text-center fade-in-up" style="margin-top: 1rem;">
    <a href="{{ url_for('auth.register') }}" class="back-link">
        Need an account? Register here
    </a>
</div>

{% endblock %}
